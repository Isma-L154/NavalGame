name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://naval.cloudils.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: uv sync --locked
      - name: Deploy to Cloudflare
        run: uv run pywrangler deploy --var "BUILD_VERSION:${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Wait for the new version
        run: |
          for _ in $(seq 1 36); do
            # A failed poll (reset, non-JSON 5xx) must retry, not end the step under bash -e.
            version=$(curl -s https://naval.cloudils.com/api/health | jq -r .version 2>/dev/null) || true
            [ "$version" = "$GITHUB_SHA" ] && exit 0
            sleep 5
          done
          echo "production still serves version $version, expected $GITHUB_SHA"
          exit 1
      - name: Smoke test a real game against production
        run: uv run pytest -m integration -k "health or full_game or cpu_plays_back or third_player or sitemap or share_images" -p no:cacheprovider
        env:
          NAVAL_BASE_URL: https://naval.cloudils.com
