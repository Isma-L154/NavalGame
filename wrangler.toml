name = "naval-game"
main = "src/entry.py"
compatibility_date = "2026-09-18"
compatibility_flags = ["python_workers"]
workers_dev = false
routes = [{ pattern = "naval.cloudils.com", custom_domain = true }]

[vars]
# Local development overrides this in .dev.vars.
ALLOWED_ORIGINS = "https://naval.cloudils.com"

[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

[observability]
enabled = true

[dev]
port = 8787
# Keep local requests same-origin; by default dev rewrites them to the production host.
host = "localhost:8787"
