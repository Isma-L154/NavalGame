[project]
name = "naval-game"
version = "0.1.0"
description = "Two-player online naval battle game on Cloudflare Workers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic==2.12.5",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "mypy",
    "pytest",
    "pytest-asyncio>=1.4.0",
    "ruff",
    "websockets>=17.1",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.uv]
package = false
exclude-newer = "7 days"
# The Pyodide index publishes no upload dates, so the cooldown would hide its wheels.
# These are pinned to the exact versions bundled with the Workers Pyodide runtime.
exclude-newer-package = { pydantic = false, pydantic-core = false }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--strict-markers", "--strict-config", "-m", "not integration"]
markers = ["integration: needs a running Worker at NAVAL_BASE_URL"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "N", "RUF", "PL", "PT"]
# Domain exceptions are named after the protocol error codes they carry (e.g. NotYourTurn).
ignore = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["naval", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
# These modules import the Workers runtime (`workers`, `js`), which does not exist on CPython.
exclude = ['^src/entry\.py$', '^src/naval/worker/entry\.py$', '^src/naval/worker/game_room\.py$']
